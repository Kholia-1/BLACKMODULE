services:
  db:
    image: postgres:16
    container_name: blackmodule_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - blackmodule_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: blackmodule_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      BLACKMODULE_API_KEY: ${BLACKMODULE_API_KEY}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SESSION_HTTPS_ONLY: "true"
      ALERT_SLA_EXACT_HOURS: ${ALERT_SLA_EXACT_HOURS:-4}
      ALERT_SLA_PROBABLE_HOURS: ${ALERT_SLA_PROBABLE_HOURS:-24}
      ALERT_SLA_POSSIBLE_HOURS: ${ALERT_SLA_POSSIBLE_HOURS:-72}
      ALERT_SLA_NEAR_RATIO: ${ALERT_SLA_NEAR_RATIO:-0.8}
      ALERT_INACTIVITY_HOURS: ${ALERT_INACTIVITY_HOURS:-24}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-true}
      EMAIL_NOTIFICATION_MAX_ATTEMPTS: ${EMAIL_NOTIFICATION_MAX_ATTEMPTS:-3}
      EMAIL_NOTIFICATION_RETRY_MINUTES: ${EMAIL_NOTIFICATION_RETRY_MINUTES:-15}
    ports:
      - "127.0.0.1:10000:10000"

volumes:
  blackmodule_postgres_data:
