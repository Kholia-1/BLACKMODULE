x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: blackmodule_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB doit etre defini}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER doit etre defini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}
    volumes:
      - blackmodule_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    logging: *default-logging

  app:
    build: .
    container_name: blackmodule_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      BLACKMODULE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER doit etre defini}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}@db:5432/${POSTGRES_DB:?POSTGRES_DB doit etre defini}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY doit etre defini}
      BLACKMODULE_API_KEY: ${BLACKMODULE_API_KEY:?BLACKMODULE_API_KEY doit etre defini}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SESSION_HTTPS_ONLY: "true"
      ALERT_SLA_EXACT_HOURS: ${ALERT_SLA_EXACT_HOURS:-4}
      ALERT_SLA_PROBABLE_HOURS: ${ALERT_SLA_PROBABLE_HOURS:-24}
      ALERT_SLA_POSSIBLE_HOURS: ${ALERT_SLA_POSSIBLE_HOURS:-72}
      ALERT_SLA_NEAR_RATIO: ${ALERT_SLA_NEAR_RATIO:-0.8}
      ALERT_INACTIVITY_HOURS: ${ALERT_INACTIVITY_HOURS:-24}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      BOOTSTRAP_PASSWORD_TTL_HOURS: ${BOOTSTRAP_PASSWORD_TTL_HOURS:-24}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      SENSITIVE_RATE_LIMIT_ATTEMPTS: ${SENSITIVE_RATE_LIMIT_ATTEMPTS:-120}
      SENSITIVE_RATE_LIMIT_WINDOW_SECONDS: ${SENSITIVE_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_ERROR_THRESHOLD: ${MONITORING_ERROR_THRESHOLD:-5}
      MONITORING_ERROR_WINDOW_SECONDS: ${MONITORING_ERROR_WINDOW_SECONDS:-60}
      MONITORING_LATENCY_WARNING_MS: ${MONITORING_LATENCY_WARNING_MS:-2000}
      MONITORING_HEALTHCHECK_INTERVAL_SECONDS: ${MONITORING_HEALTHCHECK_INTERVAL_SECONDS:-60}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-true}
      EMAIL_NOTIFICATION_MAX_ATTEMPTS: ${EMAIL_NOTIFICATION_MAX_ATTEMPTS:-3}
      EMAIL_NOTIFICATION_RETRY_MINUTES: ${EMAIL_NOTIFICATION_RETRY_MINUTES:-15}
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:10000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  migrate:
    build: .
    profiles: ["database-migration"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BLACKMODULE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER doit etre defini}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}@db:5432/${POSTGRES_DB:?POSTGRES_DB doit etre defini}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY doit etre defini}
      BLACKMODULE_API_KEY: ${BLACKMODULE_API_KEY:?BLACKMODULE_API_KEY doit etre defini}
    entrypoint: ["alembic", "-c", "/code/alembic.ini"]
    command: ["upgrade", "head"]
    restart: "no"
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128
    logging: *default-logging

  db-tools:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    profiles: ["database-tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB doit etre defini}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER doit etre defini}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - blackmodule_postgres_backups:/backups
      - ./scripts:/opt/blackmodule/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/opt/blackmodule/scripts/postgres_backup.sh"]
    restart: "no"
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    logging: *default-logging

volumes:
  blackmodule_postgres_data:
  blackmodule_postgres_backups:
    external: true
    name: ${POSTGRES_BACKUP_VOLUME:-blackmodule_postgres_backups}
