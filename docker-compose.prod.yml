services:
  db:
    image: postgres:16
    container_name: blackmodule_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - blackmodule_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: blackmodule_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      BLACKMODULE_API_KEY: ${BLACKMODULE_API_KEY}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SESSION_HTTPS_ONLY: "true"
      ALERT_SLA_EXACT_HOURS: ${ALERT_SLA_EXACT_HOURS:-4}
      ALERT_SLA_PROBABLE_HOURS: ${ALERT_SLA_PROBABLE_HOURS:-24}
      ALERT_SLA_POSSIBLE_HOURS: ${ALERT_SLA_POSSIBLE_HOURS:-72}
      ALERT_SLA_NEAR_RATIO: ${ALERT_SLA_NEAR_RATIO:-0.8}
    ports:
      - "127.0.0.1:10000:10000"

volumes:
  blackmodule_postgres_data:
