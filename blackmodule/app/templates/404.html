<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BLACKMODULE - Page introuvable</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}.card{max-width:500px;width:100%;padding:36px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 2px #0f172a0d;text-align:center}.code{display:inline-block;margin-bottom:18px;padding:5px 14px;border-radius:999px;background:#fef2f2;color:#b91c1c;font-size:15px;font-weight:700}h1{margin:0 0 12px;font-size:22px;color:#0f172a}p{margin:0 0 26px;color:#64748b;line-height:1.6}.btn{display:inline-block;padding:11px 18px;border-radius:8px;background:#dc2626;color:#fff;text-decoration:none;font-weight:700}.btn:hover{background:#b91c1c}
    </style>
</head>
<body>
<main class="page"><section class="card"><div class="code">404</div><h1>{{ title or 'Page introuvable' }}</h1><p>{{ message or 'La ressource demandée est introuvable.' }}</p><a class="btn" href="{{ return_url or '/web/dashboard' }}">{{ return_label or 'Retour au dashboard' }}</a></section></main>
</body>
</html>
