<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BLACKMODULE - Modifier utilisateur</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #F8FAFC;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #0F172A;
            color: white;
            padding: 22px 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            margin: 6px 0 0;
            color: #94A3B8;
            font-size: 13.5px;
        }

        .nav {
            margin-top: 15px;
        }

        .nav a {
            color: #94A3B8;
            margin-right: 18px;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            padding: 28px 32px;
            max-width: 700px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.06);
        }

        h2 {
            margin-top: 0;
            color: #0F172A;
            font-size: 17px;
            font-weight: 600;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
        }

        button {
            margin-top: 20px;
            padding: 11px 18px;
            background: #DC2626;
            color: white;
            border: 1px solid #DC2626;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            margin-top: 20px;
            margin-left: 8px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 14px;
        }

        .info {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            padding: 14px;
            border-radius: 10px;
            color: #334155;
            font-size: 13.5px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>BLACKMODULE</h1>
    <p>Modification d'un utilisateur</p>

    {% include "partials/navbar.html" %}
</div>

<div class="container">

    <div class="card">
        <h2>Modifier l’utilisateur</h2>

        <div class="info">
            <strong>Utilisateur :</strong> {{ user.username }}<br>
            <strong>Date création :</strong> {{ user.created_at.strftime('%Y-%m-%d %H:%M') if user.created_at else "-" }}
        </div>

        <form method="post" action="/web/users/{{ user.id }}/edit">
            <label>Nom d'utilisateur</label>
            <input type="text" value="{{ user.username }}" disabled>

            <label>Nom complet</label>
            <input type="text" name="full_name" value="{{ user.full_name or '' }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ user.email or '' }}">

            <label>Rôle</label>
            <select name="role" required>
                <option value="LECTEUR" {% if user.role == "LECTEUR" %}selected{% endif %}>LECTEUR</option>
                <option value="OPERATEUR" {% if user.role == "OPERATEUR" %}selected{% endif %}>OPERATEUR</option>
                <option value="SUPERVISEUR" {% if user.role == "SUPERVISEUR" %}selected{% endif %}>SUPERVISEUR</option>
                <option value="ADMIN" {% if user.role == "ADMIN" %}selected{% endif %}>ADMIN</option>
            </select>

            <label>Statut</label>
            <select name="statut" required>
                <option value="ACTIF" {% if user.statut == "ACTIF" %}selected{% endif %}>ACTIF</option>
                <option value="INACTIF" {% if user.statut == "INACTIF" %}selected{% endif %}>INACTIF</option>
            </select>

            <button type="submit">Enregistrer les modifications</button>
            <a class="btn-secondary" href="/web/users">Retour</a>
        </form>
    </div>

</div>

</body>
</html>
