<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BLACKMODULE - Connexion</title>
<link rel="stylesheet" href="/static/css/styles.css">
    <style>
        :root {
            --afri-red: #DC2626;
            --afri-red-dark: #B91C1C;
            --afri-black: #0F172A;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--afri-black);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(220, 38, 38, 0.16), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(220, 38, 38, 0.10), transparent 45%);
            margin: 0;
            padding: 0;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            justify-content: center;
        }

        .login-brand-mark {
            width: 10px;
            height: 26px;
            background: var(--afri-red);
            border-radius: 2px;
        }

        .login-brand span {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        .login-card {
            background: white;
            width: 380px;
            max-width: 100%;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.06);
        }

        h1 {
            margin: 0;
            color: var(--afri-black);
            font-size: 22px;
            font-weight: 700;
        }

        p {
            color: #64748B;
            margin: 6px 0 24px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font-sans);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--afri-red);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--afri-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14.5px;
            font-family: var(--font-sans);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            background: var(--afri-red-dark);
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
            padding: 11px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13.5px;
            font-weight: 600;
        }

        .hint {
            margin-top: 18px;
            background: #F1F5F9;
            color: #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 12.5px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div>
        <div class="login-brand">
            <div class="login-brand-mark"></div>
            <span>BLACKMODULE</span>
        </div>

    <div class="login-card">
        <h1>Connexion</h1>
        <p>Connexion au module de conformité</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/web/login">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" required>

            <label>Mot de passe</label>
            <input type="password" name="password" required>

            <button type="submit">Se connecter</button>
        </form>

    </div>
    </div>
</div>

<script>
    sessionStorage.removeItem('bm_critical_notified');
</script>

</body>
</html>
