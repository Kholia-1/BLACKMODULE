<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BLACKMODULE - Accès refusé</title>

    <style>
        :root {
            --afri-red: #DC2626;
            --afri-red-dark: #B91C1C;
            --afri-black: #0F172A;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: #F8FAFC;
            margin: 0;
            padding: 0;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card {
            background: white;
            max-width: 480px;
            width: 100%;
            border-radius: 14px;
            padding: 36px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.06);
            border: 1px solid #E2E8F0;
            text-align: center;
        }

        .code {
            display: inline-block;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--afri-red-dark);
            background: rgba(220, 38, 38, 0.10);
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
        }

        h1 {
            color: var(--afri-black);
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 700;
        }

        p {
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 26px;
            font-size: 14.5px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            background: var(--afri-red);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            margin: 5px;
            transition: background 0.15s ease;
        }

        .btn:hover {
            background: var(--afri-red-dark);
        }

        .btn-secondary {
            background: #F1F5F9;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #E2E8F0;
        }
    </style>
</head>

<body>

<div class="page">
    <div class="card">
        <div class="code">403</div>

        <h1>Accès refusé</h1>

        <p>
            Vous n’avez pas les droits nécessaires pour accéder à cette page.
            Veuillez contacter un administrateur si vous pensez qu’il s’agit d’une erreur.
        </p>

        <a class="btn" href="/web/dashboard">Retour au dashboard</a>
        <a class="btn btn-secondary" href="/web/logout">Se déconnecter</a>
    </div>
</div>

</body>
</html>
